<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epileptic Bot — Staff Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        },
                        bordercolor: '#262b3a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0c0e14; color: #e2e8f0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .glass-card { background: rgba(22, 26, 36, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-glow { background: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.25) 0%, transparent 60%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="gradient-glow absolute inset-0 pointer-events-none"></div>

    <div class="glass-card max-w-md w-full rounded-2xl p-8 shadow-2xl relative z-10 border border-bordercolor">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 mx-auto flex items-center justify-center shadow-lg shadow-brand-500/30 mb-4">
                <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">EPILEPTIC BOT</h1>
            <p class="text-xs text-gray-400 mt-1">Staff Dashboard Authentication</p>
        </div>

        {% if error %}
        <div class="mb-6 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-sm"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" required autocomplete="username" placeholder="admin" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-black/40 border border-bordercolor text-white text-sm focus:outline-none focus:border-brand-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-black/40 border border-bordercolor text-white text-sm focus:outline-none focus:border-brand-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-brand-600/30 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Sign In to Dashboard</span>
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            Protected with anti-abuse guards & timing-safe authentication.
        </div>
    </div>
</body>
</html>
